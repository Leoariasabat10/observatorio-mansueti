# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Editor at /admin. Fields mirror the validator in src/lib/content.ts (see README, "Campos").
# The eje and país lists repeat src/content/ejes.json and src/lib/paises.ts: change both together
# (the build fails with a clear message if they drift).

backend:
  name: github
  repo: ORGANIZACION/observatorio-asdtss # change when the repo is created
  branch: main

media_folder: /public/afiches
public_folder: /afiches

collections:
  - name: webinars
    label: Webinars
    label_singular: Webinar
    folder: /src/content/webinars
    extension: md
    format: frontmatter
    create: true
    identifier_field: titulo
    slug:
      template: "{{fecha}}-{{slug}}"
      editable: [create]
    summary: "{{fecha}} · {{titulo}}"
    sortable_fields: [fecha, titulo]
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Fecha (hora de Bogotá), name: fecha, widget: datetime, type: date }
      - { label: "Hora de inicio (24 h, Bogotá)", name: hora, widget: string, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Formato HH:MM, por ejemplo 18:00"] }
      - { label: Duración (minutos), name: duracionMin, widget: number, value_type: int, default: 90, min: 15 }
      - label: Ejes temáticos
        name: ejes
        widget: select
        multiple: true
        min: 1
        options:
          - { label: "Negociación colectiva", value: negociacion-colectiva }
          - { label: "Seguridad social", value: seguridad-social }
          - { label: "Trabajo en plataformas digitales", value: plataformas-digitales }
          - { label: "Género y trabajo", value: genero-y-trabajo }
      - label: Modalidad
        name: modalidad
        widget: select
        default: virtual
        options:
          - { label: Virtual, value: virtual }
          - { label: Presencial, value: presencial }
          - { label: Híbrida, value: hibrida }
      - { label: Plataforma, name: plataforma, widget: string, required: false, hint: "Zoom, YouTube…" }
      - { label: Lugar, name: lugar, widget: string, required: false, hint: Solo para presencial o híbrida }
      - { label: Resumen, name: resumen, widget: text, hint: Una o dos frases. Se ve en la lista y al compartir. }
      - label: Ponentes
        name: ponentes
        widget: list
        min: 1
        summary: "{{nombre}} ({{pais}})"
        fields:
          - { label: Nombre, name: nombre, widget: string }
          - { label: Rol, name: rol, widget: string, required: false, hint: "Ponente, Moderación…" }
          - { label: Cargo, name: cargo, widget: string, required: false }
          - { label: Institución, name: institucion, widget: string, required: false }
          - label: País
            name: pais
            widget: select
            options:
              - { label: "Argentina", value: AR }
              - { label: "Bolivia", value: BO }
              - { label: "Brasil", value: BR }
              - { label: "Chile", value: CL }
              - { label: "Colombia", value: CO }
              - { label: "Ecuador", value: EC }
              - { label: "Guyana", value: GY }
              - { label: "Paraguay", value: PY }
              - { label: "Perú", value: PE }
              - { label: "Surinam", value: SR }
              - { label: "Uruguay", value: UY }
              - { label: "Venezuela", value: VE }
              - { label: "México", value: MX }
              - { label: "España", value: ES }
              - { label: "Italia", value: IT }
              - { label: "Panamá", value: PA }
              - { label: "Costa Rica", value: CR }
              - { label: "Estados Unidos", value: US }
      - { label: Afiche, name: afiche, widget: image, required: false, hint: "Proporción 4:5, mínimo 800×1000 px" }
      - { label: Descripción del afiche, name: aficheAlt, widget: string, required: false, hint: Obligatoria si hay afiche (para lectores de pantalla) }
      - { label: Formato, name: formato, widget: string, required: false, hint: "Ej.: Conversatorio de fin de año, Webinar, Conferencia" }
      - { label: Enlace de inscripción, name: inscripcion, widget: string, required: false }
      - { label: Enlace para unirse a la reunión (Teams, Zoom, Meet), name: reunion, widget: string, required: false }
      - { label: Cómo participar (sin enlace de inscripción), name: acceso, widget: string, required: false, hint: "Ej.: El enlace de la reunión está en el código QR del afiche oficial." }
      - { label: Enlace de la grabación, name: grabacion, widget: string, required: false }
      - { label: Contenido de ejemplo, name: ejemplo, widget: boolean, default: false, required: false }
      - { label: Descripción, name: body, widget: markdown }

  - name: publicaciones
    label: Publicaciones
    label_singular: Publicación
    folder: /src/content/publicaciones
    extension: md
    format: frontmatter
    create: true
    identifier_field: titulo
    media_folder: /public/publicaciones
    public_folder: /publicaciones
    slug:
      template: "{{fecha}}-{{slug}}"
      editable: [create]
    summary: "{{fecha}} · {{titulo}}"
    sortable_fields: [fecha, titulo]
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Fecha de publicación, name: fecha, widget: datetime, type: date }
      - label: Categoría
        name: categoria
        widget: select
        options:
          - { label: Boletín, value: boletines }
          - { label: Documento de trabajo, value: documentos }
          - { label: Intervención judicial, value: intervenciones }
          - { label: Datos y análisis, value: datos }
      - { label: Número (solo boletines), name: numero, widget: number, value_type: int, required: false }
      - label: Ejes temáticos
        name: ejes
        widget: select
        multiple: true
        min: 1
        options:
          - { label: "Negociación colectiva", value: negociacion-colectiva }
          - { label: "Seguridad social", value: seguridad-social }
          - { label: "Trabajo en plataformas digitales", value: plataformas-digitales }
          - { label: "Género y trabajo", value: genero-y-trabajo }
      - label: Autores
        name: autores
        widget: list
        min: 1
        summary: "{{nombre}}"
        fields:
          - { label: Nombre, name: nombre, widget: string }
          - { label: Institución, name: institucion, widget: string, required: false }
      - { label: Resumen, name: resumen, widget: text, hint: "Dos o tres frases. Se ve en el catálogo y al compartir." }
      - { label: PDF, name: pdf, widget: file, required: false, hint: "Archivo PDF de la publicación" }
      - { label: Enlace a la fuente original, name: enlace, widget: string, required: false }
      - { label: Portada, name: portada, widget: image, required: false, hint: "Proporción 3:4" }
      - { label: Descripción de la portada, name: portadaAlt, widget: string, required: false, hint: "Obligatoria si hay portada" }
      - { label: Contenido de ejemplo, name: ejemplo, widget: boolean, default: false, required: false }
      - { label: Texto, name: body, widget: markdown }

  - name: actualidad
    label: Actualidad
    label_singular: Novedad
    folder: /src/content/actualidad
    extension: md
    format: frontmatter
    create: true
    identifier_field: titulo
    media_folder: /public/actualidad
    public_folder: /actualidad
    slug:
      template: "{{fecha_publicacion}}-{{slug}}"
      editable: [create]
    summary: "{{fecha_publicacion}} · {{estado}} · {{titulo}}"
    sortable_fields: [fecha_publicacion, titulo, estado]
    fields:
      - { label: Título, name: titulo, widget: string }
      - { label: Fecha de publicación, name: fecha_publicacion, widget: datetime, type: date }
      - label: Estado
        name: estado
        widget: select
        default: borrador
        hint: "Solo «publicado» aparece en el sitio."
        options: [{ label: Borrador, value: borrador }, { label: En revisión, value: revision }, { label: Publicado, value: publicado }]
      - { label: Resumen fiel al original, name: resumen, widget: text }
      - { label: Ponente o autor, name: ponente_o_autor, widget: string, required: false }
      - { label: Cargo, name: cargo, widget: string, required: false }
      - { label: Institución, name: institucion, widget: string, required: false }
      - label: País
        name: pais
        widget: select
        required: false
        options:
          - { label: "Argentina", value: AR }
          - { label: "Bolivia", value: BO }
          - { label: "Brasil", value: BR }
          - { label: "Chile", value: CL }
          - { label: "Colombia", value: CO }
          - { label: "Ecuador", value: EC }
          - { label: "Guyana", value: GY }
          - { label: "Paraguay", value: PY }
          - { label: "Perú", value: PE }
          - { label: "Surinam", value: SR }
          - { label: "Uruguay", value: UY }
          - { label: "Venezuela", value: VE }
          - { label: "México", value: MX }
          - { label: "España", value: ES }
          - { label: "Italia", value: IT }
          - { label: "Panamá", value: PA }
          - { label: "Guatemala", value: GT }
          - { label: "Costa Rica", value: CR }
          - { label: "Estados Unidos", value: US }
      - label: Eje temático
        name: eje_tematico
        widget: select
        required: false
        options:
          - { label: "Negociación colectiva", value: negociacion-colectiva }
          - { label: "Seguridad social", value: seguridad-social }
          - { label: "Trabajo en plataformas digitales", value: plataformas-digitales }
          - { label: "Género y trabajo", value: genero-y-trabajo }
      - { label: Imagen, name: imagen, widget: image, required: false, hint: "Solo con permiso de reutilización" }
      - { label: Texto alternativo, name: texto_alternativo, widget: string, required: false, hint: "Obligatorio si hay imagen. Solo lo que realmente se ve." }
      - { label: Crédito de la imagen, name: credito, widget: string, required: false, hint: "Obligatorio si hay imagen" }
      - label: Página de origen
        name: pagina_fuente
        widget: select
        options: [{ label: Observatorio, value: observatorio }, { label: ASDTSS, value: asdtss }]
      - { label: Enlace a la publicación original, name: url_original, widget: string }
      - { label: ID de la publicación, name: id_publicacion, widget: string }
      - { label: Fecha de importación, name: fecha_importacion, widget: datetime, type: date, required: false }
      - { label: Huella del contenido, name: huella_contenido, widget: string, required: false }
      - { label: Puntuación (0-10), name: puntuacion, widget: number, value_type: float, min: 0, max: 10, required: false }
      - { label: Motivo de la decisión, name: motivo_decision, widget: text, required: false }
      - { label: Evento ya realizado, name: evento_realizado, widget: boolean, default: false, required: false, hint: "Muestra la etiqueta «Evento realizado»" }
      - { label: Contenido de ejemplo, name: ejemplo, widget: boolean, default: false, required: false }
      - { label: Texto completo, name: body, widget: markdown, required: false }

  - name: datos
    label: Cifras del Inicio
    files:
      - name: cifras
        label: Cifras destacadas
        file: /src/content/cifras.json
        format: json
        fields:
          - label: Cifras
            name: cifras
            widget: list
            summary: "{{label}}: {{valor}}"
            fields:
              - { label: Qué se mide, name: label, widget: string }
              - { label: Valor, name: valor, widget: number, value_type: int, required: false, hint: "Vacío = se muestra «Dato pendiente»" }
              - { label: Fuente, name: fuente, widget: string, required: false, hint: "Obligatoria si hay valor. Ej.: registros de Zoom" }
              - { label: Fecha del dato, name: fecha, widget: datetime, type: date, required: false }

  - name: voces
    label: Voces del Derecho del Trabajo Sudamérica
    files:
      - name: videos
        label: Videos
        file: /src/content/voces.json
        format: json
        fields:
          - label: Videos
            name: videos
            widget: list
            summary: "{{pais}} · {{persona}}: {{titulo}}"
            fields:
              - { label: Título, name: titulo, widget: string }
              - { label: Persona participante, name: persona, widget: string }
              - label: País
                name: pais
                widget: select
                options: [{ label: Argentina, value: AR }, { label: Bolivia, value: BO }, { label: Brasil, value: BR }, { label: Chile, value: CL }, { label: Colombia, value: CO }, { label: Ecuador, value: EC }, { label: Guyana, value: GY }, { label: Paraguay, value: PY }, { label: Perú, value: PE }, { label: Surinam, value: SR }, { label: Uruguay, value: UY }, { label: Venezuela, value: VE }]
              - label: Tipo
                name: tipo
                widget: select
                options: [{ label: Exposición, value: exposicion }, { label: Entrevista, value: entrevista }, { label: Aporte, value: aporte }]
              - { label: Descripción, name: descripcion, widget: text }
              - { label: Enlace o archivo de video, name: url, widget: string, hint: "https://… (YouTube, Vimeo…) o /voces/archivo.mp4 si el archivo está en public/voces/" }
              - { label: Miniatura, name: miniatura, widget: string, required: false, hint: "Ruta de una imagen en public/voces/, por ejemplo /voces/miniatura.webp" }
              - { label: Fecha, name: fecha, widget: string, required: false, hint: "AAAA-MM-DD" }
              - { label: Destacado, name: destacado, widget: boolean, default: false, required: false }

  - name: latitud
    label: Latitud Sudamericana
    files:
      - name: ediciones
        label: Ediciones
        file: /src/content/latitud.json
        format: json
        fields:
          - label: Ediciones (la más reciente primero)
            name: ediciones
            widget: list
            summary: "{{etiqueta}}"
            fields:
              - { label: Identificador (URL), name: slug, widget: string, hint: "Sin tildes ni espacios, p. ej. noviembre-2026" }
              - { label: Etiqueta de la edición, name: etiqueta, widget: string, hint: "Edición noviembre 2026" }
              - { label: Título, name: titulo, widget: string }
              - { label: Fecha de publicación, name: fecha, widget: string, required: false, hint: "AAAA-MM-DD, solo si hay una fecha exacta" }
              - { label: Portada, name: portada, widget: string, hint: "/latitud/<carpeta>/portada.webp" }
              - { label: Ancho de la portada (px), name: portadaW, widget: number, value_type: int }
              - { label: Alto de la portada (px), name: portadaH, widget: number, value_type: int }
              - label: Artículos
                name: articulos
                widget: list
                summary: "{{pais}}: {{titulo}}"
                fields:
                  - { label: País (código ISO), name: pais, widget: string, hint: "AR, BO, BR, CO, EC, PY, PE…" }
                  - { label: Título, name: titulo, widget: string }
                  - { label: Imagen o lámina, name: imagen, widget: string, hint: "/latitud/<carpeta>/archivo.webp" }
                  - { label: Autoría, name: autor, widget: string, required: false, hint: "Solo si la fuente la indica" }
                  - { label: Resumen, name: resumen, widget: text, required: false }
                  - { label: Enlace al artículo completo, name: enlace, widget: string, required: false, hint: "https://…" }

  - name: agenda
    label: Agenda Laboral Internacional
    files:
      - name: eventos
        label: Eventos
        file: /src/content/agenda.json
        format: json
        fields:
          - label: Eventos
            name: eventos
            widget: list
            summary: "{{fecha}} · {{nombre}}"
            fields:
              - { label: Nombre del evento, name: nombre, widget: string }
              - { label: Fecha (primer día), name: fecha, widget: string, hint: "AAAA-MM-DD" }
              - { label: Fecha de cierre, name: fechaFin, widget: string, required: false, hint: "AAAA-MM-DD, solo si dura varios días" }
              - { label: Hora, name: hora, widget: string, required: false, hint: "HH:MM en 24 h" }
              - { label: Zona horaria, name: zona, widget: string, required: false, hint: "Obligatoria si hay hora. Ej.: hora de Colombia (UTC−5)" }
              - label: Modalidad
                name: modalidad
                widget: select
                options: [{ label: Presencial, value: presencial }, { label: Virtual, value: virtual }, { label: Híbrida, value: hibrida }]
              - label: País
                name: pais
                widget: select
                required: false
                hint: Obligatorio si es presencial o híbrido
                options: [{ label: Argentina, value: AR }, { label: Bolivia, value: BO }, { label: Brasil, value: BR }, { label: Chile, value: CL }, { label: Colombia, value: CO }, { label: Ecuador, value: EC }, { label: España, value: ES }, { label: Guatemala, value: GT }, { label: Guyana, value: GY }, { label: Italia, value: IT }, { label: México, value: MX }, { label: Panamá, value: PA }, { label: Paraguay, value: PY }, { label: Perú, value: PE }, { label: Surinam, value: SR }, { label: Uruguay, value: UY }, { label: Venezuela, value: VE }]
              - { label: Ciudad, name: ciudad, widget: string, required: false }
              - { label: Institución organizadora, name: organizador, widget: string }
              - { label: Tema o descripción breve, name: descripcion, widget: text }
              - { label: Enlace oficial, name: enlace, widget: string, hint: "https://… información o inscripción" }
              - { label: Imagen, name: imagen, widget: string, required: false, hint: "/agenda/archivo.webp (en public/agenda/)" }
              - { label: Texto alternativo de la imagen, name: imagenAlt, widget: string, required: false, hint: "Obligatorio si hay imagen" }
